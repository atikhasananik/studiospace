<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Mode Container Background Gradient -->
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#181C26" />
      <stop offset="100%" stop-color="#090A0F" />
    </radialGradient>

    <!-- Electric Amber Signal Gradient -->
    <linearGradient id="amberGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FF4D00" />
    </linearGradient>

    <!-- Cyan Pulse Accent Gradient -->
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <!-- Metallic/Glass Stroke Gradient -->
    <linearGradient id="glassStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#232838" />
      <stop offset="50%" stop-color="#3A4259" />
      <stop offset="100%" stop-color="#181C26" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowAmber" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Canvas (Dark Luxury Obsidian) -->
  <rect width="512" height="512" rx="100" fill="url(#bgGradient)" stroke="url(#glassStroke)" stroke-width="4"/>

  <!-- Subtle Aperture/Grid Backdrop Geometry -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="1.5" fill="none">
    <circle cx="256" cy="256" r="180" stroke-dasharray="6,6"/>
    <circle cx="256" cy="256" r="130"/>
    <circle cx="256" cy="256" r="80" stroke-dasharray="4,4"/>
    <line x1="256" y1="56" x2="256" y2="456"/>
    <line x1="56" y1="256" x2="456" y2="256"/>
  </g>

  <!-- Outer Isometric S Block Structure (Studio Geometry) -->
  <path d="M 176 136 L 336 136 C 362.5 136 384 157.5 384 184 L 384 216 C 384 242.5 362.5 264 336 264 L 176 264 C 149.5 264 128 285.5 128 312 L 128 344 C 128 370.5 149.5 392 176 392 L 336 392" 
        fill="none" 
        stroke="url(#amberGradient)" 
        stroke-width="36" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glowAmber)"/>

  <!-- Inner Kinetic Soundwave & Viewfinder Corner Accents -->
  <!-- Top Left Viewfinder Bracket -->
  <path d="M 148 180 L 148 168 C 148 156.95 156.95 148 168 148 L 180 148" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Bottom Right Viewfinder Bracket -->
  <path d="M 364 332 L 364 344 C 364 355.05 355.05 364 344 364 L 332 364" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.8"/>

  <!-- Center Active Studio Tally Light (Recording Signal) -->
  <circle cx="336" cy="200" r="14" fill="#00F2FE" filter="url(#glowCyan)"/>
  <circle cx="336" cy="200" r="6" fill="#FFFFFF"/>

  <!-- Center Waveform Equalizer / Play-Aperture Accent -->
  <g transform="translate(230, 292)">
    <line x1="0" y1="-12" x2="0" y2="12" stroke="#00F2FE" stroke-width="6" stroke-linecap="round"/>
    <line x1="16" y1="-22" x2="16" y2="22" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <line x1="32" y1="-16" x2="32" y2="16" stroke="url(#amberGradient)" stroke-width="6" stroke-linecap="round"/>
    <line x1="48" y1="-8" x2="48" y2="8" stroke="#00F2FE" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>